# Netlify (free tier). Netlify detects Next.js and applies its adapter
# automatically. Data lives in Turso, because Netlify functions have no
# persistent disk — set DATABASE_URL and DATABASE_AUTH_TOKEN in
# Site configuration → Environment variables (see README "Deploying for free").

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Declared explicitly so the server routes are always deployed as functions,
# even if Netlify's framework auto-detection doesn't kick in.
[[plugins]]
  package = "@netlify/plugin-nextjs"
